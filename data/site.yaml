# Topic tags shown as filter chips on Publications.
# `keywords` is a regex matched against title + journal; it labels papers automatically.
# Add `tags: [id, ...]` for a paper in data/publication-meta.yaml to set tags explicitly.
topics:
  # abbr is shown as a badge on every publication; keywords (regex, case-insensitive) auto-tag by title + journal.
  # You can also force tags per paper in publication-meta.yaml (tags: [dd, asd, ad, gpcr, cip]).
  - id: dd
    abbr: DD
    en: Drug discovery
    keywords: "degrader|protac|molecular glue|\\bglue\\b|inhibitor|\\bdrug|screening|binder|ligand|compound|small[- ]molecule|cereblon|crbn|ubiquitin|e3 ligase|proteasom|autophagy|attec|agonist|antagonist|therapeutic|docking"
  - id: asd
    abbr: ASD
    en: Autism spectrum disorder
    keywords: "autis|\\basd\\b|shank|neurodevelopment|adnp|ash1l|psd-?95|synaptopath"
  - id: ad
    abbr: AD
    en: Alzheimer's disease
    keywords: "alzheimer|amyloid|\\btau\\b|\\bapp\\b|neurodegenerat|nurr1"
  - id: gpcr
    abbr: GPCR
    en: GPCR
    keywords: "gpcr|g protein-coupled|g-protein|5-?ht|serotonin|dopamine receptor|orexin|ghrelin|arrestin|cannabinoid"
  - id: cip
    abbr: CIP
    en: Chemically induced proximity
    keywords: "induced proximity|proximity|degrader|protac|molecular glue|\\bglue\\b|ternary|heterobifunctional|cereblon|crbn|ddb1|gspt1|ikzf|e3 ligase|e3 ubiquitin|ubiquitin ligase|targeted protein degradation|attec|lysosome-targeting|neo-?substrate|dimerizer"

# Author marks for the PI (shown after the name in bold orange).
#   *  = (co-)corresponding author     #  = co-first author     "#*" allowed
# pi_name: regex that finds the PI in the author string (ORCID/Crossref writes "Kim DY").
# By journal (applied to every paper in that journal); override per paper in publication-meta.yaml (mark: "#").
pi_name: "Doyoun Kim|Do-?youn Kim|Kim D(Y)?(?![A-Za-z])"
author_marks:
  # pos: 2 = the PI is the 2nd "Kim D" in the author list (when another Kim D appears earlier)
  - { title: "carbonic anhydrase 9", year: 2025, journal: "^results in chemistry", mark: "*", pos: 2 }
  # rules may combine journal / title / year (all given conditions must match); first match wins
  - { title: "arid1b", year: 2022, journal: "^nature communications", mark: "#" }
  - { journal: "^results in chemistry", mark: "*" }
  - { journal: "^frontiers in bioengineering", mark: "*" }
  - { journal: "^frontiers in microbiology", mark: "*" }
  - { journal: "^neuron$", mark: "#" }
