# Per-paper annotations, keyed by DOI (lowercase). ORCID cannot supply these.
#   tags:     topic ids from data/site.yaml (adds to automatic keyword tagging)
#   selected: true to show under "Selected" and on the Home page
#   figure:   optional image path (public/images/pubs/...)
#   hidden:   true to hide a record
#   mark:     PI mark after Kim's name: "*" corresponding, "#" co-first, "#*" both, "" none (overrides journal rule in site.yaml)
#
# Example:
# "10.1038/s41467-025-00000-0":
#   tags: [degrader, structure]
#   selected: true
