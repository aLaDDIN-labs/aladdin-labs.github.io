  - id: circuits
    title:
      en: GPCR-mediated neuroprotection
      ko: GPCR 기반 신경 보호
    summary:
      en: GPCR signaling that stabilizes Nurr1 by blocking its E3 ligase-mediated degradation, so that neurogenesis and neuroprotection are driven together. Signaling-biased agonists and de novo designed proteins are tested in human neural progenitor models.
      ko: GPCR 신호로 Nurr1의 E3 ligase 매개 분해를 막아 안정화하고, 신경 생성과 신경 보호를 함께 유도합니다. 신호 편향 작용제와 de novo 설계 단백질을 인간 신경전구세포 모델에서 검증합니다.
