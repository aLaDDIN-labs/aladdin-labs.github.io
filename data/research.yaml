  - id: degraders
    title:
      en: Molecular glues for undruggable targets
      ko: Undruggable 표적을 위한 분자접착제
    summary:
      en: In silico evaluation that tells active from inactive compounds, used to find molecular glues beyond glutarimide scaffolds and to widen the set of E3 ligases. Structure, biophysics and cell assays confirm the predictions.
      ko: 활성/비활성 화합물을 구별하는 in silico 평가로 glutarimide 골격을 넘는 분자접착제를 찾고 E3 ligase 범위를 넓힙니다. 구조, 생물물리, 세포 분석으로 예측을 검증합니다.
